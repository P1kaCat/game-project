name: Release

# Publishing a version (either way):
#   - bump it with tools/release/set_version.py X.Y.Z, commit and push to the
#     default branch: this workflow creates the tag vX.Y.Z and the release, or
#   - push a tag vX.Y.Z yourself.
# A release that already exists is never rebuilt. Each release contains:
#   game-windows.pck / game-android.pck + manifest.json  (content updates: the
#       launcher downloads and hot-loads them, no restart, no reinstall)
#   IsoRPG-windows.zip / IsoRPG.apk                     (full builds, used for
#       first installs and when the "base" changes, see set_version.py)
#
# One-time setup: repository secret ANDROID_DEBUG_KEYSTORE_BASE64 = the Android
# signing keystore, base64-encoded. Every APK must be signed with the same key,
# otherwise Android refuses to install it over the previous version.

on:
  push:
    tags: ["v*.*.*"]
    branches: ["**"]
    paths: ["build_info.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    # Branch pushes only release from the default branch.
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(python3 -c 'import json; print(json.load(open("build_info.json"))["version"])')"
          fi
          python3 tools/release/set_version.py "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$v already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        if: steps.version.outputs.skip != 'true'
        run: |
          base="https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable"
          curl -sSfL -o godot.zip "${base}&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          sudo ln -sf "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -sSfL -o templates.tpz "${base}&slug=export_templates.tpz&platform=templates"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/version.txt' 'templates/android_*' \
            'templates/windows_*_x86_64*' -d "$dest"
          rm -f godot.zip templates.tpz

      - name: Android SDK + JDK
        if: steps.version.outputs.skip != 'true'
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.1" "platform-tools" > /dev/null

      - name: Signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 is missing (see README > Updates)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings
        if: steps.version.outputs.skip != 'true'
        run: |
          godot --headless --path . --import > /dev/null 2>&1 || true
          f="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          python3 - "$f" <<'PY'
          import os, re, sys
          p = sys.argv[1]; s = open(p).read()
          vals = {
              "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
          }
          for k, v in vals.items():
              line = f'{k} = "{v}"'
              s, n = re.subn(rf"^{re.escape(k)} = .*$", line, s, flags=re.M)
              if n == 0:
                  s = s.rstrip("\n") + "\n" + line + "\n"
          open(p, "w").write(s)
          PY

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: tools/release/build.sh build/release

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/release/manifest.json
            build/release/game-windows.pck
            build/release/game-android.pck
            build/release/IsoRPG-windows.zip
            build/release/IsoRPG.apk
